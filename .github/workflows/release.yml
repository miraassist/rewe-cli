name: Release

# A tag v* builds korb and korb-fake for Linux and macOS (amd64, arm64) and
# publishes them with their SHA-256 sums. The binaries hold no REWE
# certificate: korb fetches it on first use.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              for cmd in korb korb-fake; do
                CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
                  -o "dist/${cmd}_${os}_${arch}" ./cmd/$cmd
              done
            done
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: Check the version
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$want\"" certs.go || { echo "certs.go Version is not $want"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
